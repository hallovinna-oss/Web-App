<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#581c87">
  <meta name="description" content="MIPHA KU — Portal digital kelas X DKV F SMK Bhumi Phala">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>MIPHA KU — Portal Digital X DKV F</title>
  
  <!-- Web App Manifest -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./logo.png">
  
  <!-- System Font Fallback & Stylesheet -->
  <link rel="stylesheet" href="./styles.css?v=rc5">
  <link rel="stylesheet" href="./theme-light.css?v=rc5">
  <link rel="stylesheet" href="./styles-mobile.css" media="(max-width:720px)">
  <script>
    window.MIPHA_IS_NATIVE = Boolean(window.Capacitor && typeof window.Capacitor.isNativePlatform === 'function' && window.Capacitor.isNativePlatform());
    if (window.MIPHA_IS_NATIVE && 'serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then((registrations) => registrations.forEach((registration) => registration.unregister())).catch(console.warn);
      if ('caches' in window) caches.keys().then((keys) => Promise.all(keys.filter((key) => key.startsWith('mipha-companion-')).map((key) => caches.delete(key)))).catch(console.warn);
    }
  </script>
</head>
<body>
  <div id="mipha-splash" class="mipha-splash" aria-label="Memuat MIPHA KU">
    <div class="splash-orb splash-orb-a"></div>
    <div class="splash-orb splash-orb-b"></div>
    <div class="splash-content">
      <div class="splash-mark"><img class="splash-logo" src="./logo.png" alt="SMK Bhumi Phala" loading="lazy"></div>
      <div class="splash-divider"></div>
      <h1>MIPHA KU</h1>
      <p>Belajar · Bertumbuh · Terhubung</p>
      <span>Portal Digital Kelas X DKV F</span>
    </div>
  </div>
  <div id="app-container">
    <!-- Rendered dynamically by app.js -->
  </div>

  <script>
    (function () {
      localStorage.setItem('mipha_theme', 'light');
      document.documentElement.dataset.theme = 'light';
      document.documentElement.dataset.themePreference = 'light';
      window.addEventListener('load', () => {
        window.setTimeout(() => document.getElementById('mipha-splash')?.classList.add('splash-exit'), 3200);
        window.setTimeout(() => document.getElementById('mipha-splash')?.remove(), 3900);
      });
    })();
  </script>

  <!-- Firebase SDK (Auth + Firestore). Files use private Nextcloud storage. -->
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <!-- RC4 uses one browser runtime. The duplicate /src module prototype is kept
       as reference only and must not run alongside these compatibility scripts. -->
  <script src="./firebase-init.js?v=rc5"></script>
  <script src="./config.js?v=rc5"></script>
  <script src="./lib/geo-utils.js?v=rc5"></script>
  <script src="./attendance-engine.js?v=rc5"></script>
  <!-- XLSX library is loaded on-demand to reduce initial mobile payload -->

  <!-- Application Engine -->
  <script src="./app.js?v=rc5"></script>
  <script src="./live-update.js?v=1"></script>
  <script src="./android-notifications.js?v=1"></script>
  <script>
    if (!window.MIPHA_IS_NATIVE && 'serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).catch(console.error));
    }
  </script>
</body>
</html>
