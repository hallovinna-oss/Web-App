[build]
publish = "."

[[headers]]
for = "/sw.js"
  [headers.values]
  Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
for = "/index.html"
  [headers.values]
  Cache-Control = "no-cache, must-revalidate"

[[headers]]
for = "/*.js"
  [headers.values]
  Cache-Control = "no-cache, must-revalidate"
